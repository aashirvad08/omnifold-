[mypy]
python_version = 3.11
strict = True
warn_unused_ignores = True
warn_redundant_casts = True
# Gate the shipped code strictly. Tests are validated by ruff + pytest;
# strict generics/return-any on numpy fixtures add friction without value.
files = app.py, config.py, serialization.py, dependencies.py, routes, services, models
# the physics package is untyped at its boundary; treat its imports as Any
# rather than forcing stubs we do not own.
[mypy-omnifold_publication.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-yaml]
ignore_missing_imports = True

# redis is an optional prod dependency; absent in minimal/test installs
[mypy-redis]
ignore_missing_imports = True

# pyarrow ships only partial types; treat its dynamic surface as Any
[mypy-pyarrow.*]
ignore_missing_imports = True
follow_imports = skip
