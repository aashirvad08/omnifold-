<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OmniFold Explorer — demo</title>
  <style>
    :root { --ink:#1a2233; --muted:#6b7688; --line:#dde3ec; --bar:#d6336c; --bg:#f7f9fc; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
           color:var(--ink); background:var(--bg); }
    .wrap { max-width: 860px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    .controls { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;
                background:#fff; border:1px solid var(--line); border-radius:10px;
                padding:16px; }
    label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
    select, button { font:inherit; padding:8px 10px; border:1px solid var(--line);
                     border-radius:8px; background:#fff; }
    button { background:var(--bar); color:#fff; border-color:var(--bar);
             cursor:pointer; font-weight:600; }
    button:disabled { opacity:.5; cursor:default; }
    #status { margin:16px 2px; color:var(--muted); min-height:20px; }
    #status.error { color:#c92a2a; }
    .card { margin-top:16px; background:#fff; border:1px solid var(--line);
            border-radius:10px; padding:16px; }
    .prov { margin-top:12px; font-size:12px; color:var(--muted); word-break:break-all; }
    svg { width:100%; height:auto; display:block; }
    .bar { fill: var(--bar); }
    .bar:hover { fill:#a61e4d; }
    .axis { stroke: var(--line); }
    .tick { fill: var(--muted); font-size:11px; }
    .blabel { fill: var(--ink); font-size:11px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>OmniFold Publication Explorer</h1>
    <p class="sub">Proof-of-concept: pick an analysis and observable, fetch a histogram from the live backend.</p>

    <div class="controls">
      <div>
        <label for="analysis">Analysis</label>
        <select id="analysis"></select>
      </div>
      <div>
        <label for="observable">Observable</label>
        <select id="observable"></select>
      </div>
      <button id="load">Fetch histogram</button>
    </div>

    <div id="status">Loading analyses…</div>
    <div class="card" id="card" hidden>
      <svg id="chart" viewBox="0 0 760 380" role="img" aria-label="histogram"></svg>
      <div class="prov" id="prov"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const analysisSel = $("analysis"), obsSel = $("observable");
    const statusEl = $("status"), card = $("card"), prov = $("prov");
    let resources = [];

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.className = isError ? "error" : "";
    }

    async function getJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res.json();
    }

    function fillObservables() {
      const chosen = resources.find((r) => r.id === analysisSel.value);
      obsSel.innerHTML = "";
      (chosen?.observables || []).forEach((name) => {
        const o = document.createElement("option");
        o.value = o.textContent = name;
        obsSel.appendChild(o);
      });
    }

    async function init() {
      try {
        const data = await getJSON("/analyses");
        resources = data.resources || [];
        if (!resources.length) { setStatus("No analyses found on the backend.", true); return; }
        resources.forEach((r) => {
          const o = document.createElement("option");
          o.value = o.textContent = r.id;
          analysisSel.appendChild(o);
        });
        fillObservables();
        setStatus("Ready — choose an observable and fetch.");
      } catch (e) {
        setStatus("Failed to load analyses: " + e.message, true);
      }
    }

    async function loadHistogram() {
      const id = analysisSel.value, obs = obsSel.value;
      if (!id || !obs) return;
      setStatus(`Fetching histogram for ${obs}…`);
      $("load").disabled = true;
      try {
        const payload = await getJSON(
          `/analyses/${encodeURIComponent(id)}/histogram?observable=${encodeURIComponent(obs)}`
        );
        renderChart(payload, obs);
        const p = payload.provenance;
        prov.textContent =
          `source: ${p.source} · checksum(${p.checksum_kind}): ${p.checksum_sha256.slice(0,12)}… ` +
          `· cached: ${p.cached} · computed: ${p.computed_at}`;
        card.hidden = false;
        setStatus(`Showing ${obs} — ${payload.data.hist.length} bins.`);
      } catch (e) {
        card.hidden = true;
        setStatus("Failed to load histogram: " + e.message, true);
      } finally {
        $("load").disabled = false;
      }
    }

    function renderChart(payload, obs) {
      const hist = payload.data.hist, edges = payload.data.edges;
      const svg = $("chart");
      const W = 760, H = 380, m = { top: 20, right: 20, bottom: 54, left: 60 };
      const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
      const n = hist.length;
      const max = Math.max(...hist, 0) || 1;
      const bw = iw / n;
      const x = (i) => m.left + i * bw;
      const y = (v) => m.top + ih - (v / max) * ih;

      const parts = [];
      // y grid + ticks
      const ticks = 4;
      for (let t = 0; t <= ticks; t++) {
        const v = (max / ticks) * t, yy = y(v);
        parts.push(`<line class="axis" x1="${m.left}" y1="${yy}" x2="${W - m.right}" y2="${yy}"/>`);
        parts.push(`<text class="tick" x="${m.left - 8}" y="${yy + 4}" text-anchor="end">${v.toFixed(1)}</text>`);
      }
      // bars + x edge labels
      for (let i = 0; i < n; i++) {
        const bx = x(i) + 2, by = y(hist[i]), bh = m.top + ih - by;
        parts.push(`<rect class="bar" x="${bx}" y="${by}" width="${bw - 4}" height="${Math.max(bh,0)}"><title>[${edges[i]}, ${edges[i+1]}): ${hist[i].toFixed(3)}</title></rect>`);
      }
      // x axis line + edge labels (start of each bin + final edge)
      parts.push(`<line class="axis" x1="${m.left}" y1="${m.top + ih}" x2="${W - m.right}" y2="${m.top + ih}"/>`);
      for (let i = 0; i <= n; i++) {
        parts.push(`<text class="tick" x="${x(i)}" y="${m.top + ih + 16}" text-anchor="middle">${edges[i]}</text>`);
      }
      parts.push(`<text class="blabel" x="${m.left + iw/2}" y="${H - 6}" text-anchor="middle">${obs}</text>`);
      parts.push(`<text class="blabel" transform="translate(16,${m.top + ih/2}) rotate(-90)" text-anchor="middle">weighted events (fb)</text>`);
      svg.innerHTML = parts.join("");
    }

    analysisSel.addEventListener("change", fillObservables);
    $("load").addEventListener("click", loadHistogram);
    init();
  </script>
</body>
</html>
